<!--
  SNAKE DROP GAME — snake rétro 8 bits servi par un ESP32 Super Mini
  - Point d'accès Wi-Fi ouvert "SNAKE DROP", DNS captif, page sur http://4.3.2.1
    (ou http://192.168.4.1 si USE_PUBLIC_IP vaut 0)
  - Le serpent traverse les bords de l'écran ; il ne meurt qu'en se mordant lui-même
  - Pommes : +10 points, le serpent grandit. Pilules (rares, clignotent puis disparaissent) :
    le serpent raccourcit de 3, sans perdre de points
  - Pixel-art dessiné en code (sprites et police maison), petits sons, mini-musique discrète,
    animations (miettes, bosse qui descend le long du serpent, explosion au game over)
  - Record gardé dans le téléphone, protection contre le rechargement accidentel
  Bibliothèques : WiFi.h, WebServer.h, DNSServer.h (incluses dans le cœur Arduino ESP32)
  Idées de portail captif reprises de CDFER/Captive-Portal-ESP32 (licence MIT) :
  https://github.com/CDFER/Captive-Portal-ESP32
-->

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SNAKE DROP GAME</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Document 2 px plus haut que l'écran, gardé à 1 px : pas de rechargement par glissement */
html { background: #0e1022; overscroll-behavior: none; }
body { min-height: calc(100vh + 2px); background: #0e1022; color: #e8f0ff; font-family: monospace;
       overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; justify-items: center;
       padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
h1 { font-size: 18px; letter-spacing: 3px; color: #5cf29a; text-shadow: 2px 2px 0 #0b3d2e, 4px 4px 0 #000; }
.hud { width: min(94vw, 52vh, 480px); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
.hud .val { color: #ffd166; }
.btns { display: flex; gap: 6px; }
.btns button { background: #1b1f3b; color: #fff; border: 2px solid #3a4280; border-radius: 6px; font-size: 15px; padding: 3px 7px; }
.btns button.off { opacity: .4; }
.board { min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { width: min(94vw, 52vh, 480px); height: min(94vw, 52vh, 480px); image-rendering: pixelated; image-rendering: crisp-edges;
         border: 4px solid #3a4280; box-shadow: 0 0 0 4px #1b1f3b, 0 0 0 8px #000; background: #151933; touch-action: none; }
.pad { display: grid; grid-template-columns: 72px 72px 72px; grid-template-rows: 58px 58px; gap: 8px; }
.pad button { background: #1b1f3b; color: #5cf29a; border: 3px solid #3a4280; border-radius: 10px; font-size: 22px; font-weight: bold;
              box-shadow: 0 4px 0 #000; }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; background: #262b55; }
.up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div class="app">
  <h1>SNAKE DROP GAME</h1>
  <div class="hud">
    <span>SCORE <span class="val" id="score">0</span></span>
    <span>RECORD <span class="val" id="best">0</span></span>
    <span class="btns">
      <button id="bPause" type="button" aria-label="Pause">⏸</button>
      <button id="bMusic" type="button" aria-label="Musique">♪</button>
      <button id="bSound" type="button" aria-label="Son">🔊</button>
    </span>
  </div>
  <div class="board"><canvas id="cv" width="160" height="160"></canvas></div>
  <div class="pad">
    <button class="up" id="up" type="button">▲</button>
    <button class="left" id="left" type="button">◀</button>
    <button class="down" id="down" type="button">▼</button>
    <button class="right" id="right" type="button">▶</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const N = 20, C = 8, W = N * C;          // grille 20 x 20, cases de 8 px

// ---------- Anti-rechargement ----------
function lift(){ if (window.scrollY < 1) window.scrollTo(0, 1); }
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('scroll', lift, { passive: true });
window.addEventListener('load', () => setTimeout(lift, 50));
window.addEventListener('beforeunload', e => { if (state === 'play') { e.preventDefault(); e.returnValue = ''; } });

// ---------- Réglages mémorisés ----------
function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
let best = +load('snake_best', 0) || 0;
let soundOn = load('snake_snd', '1') === '1';
let musicOn = load('snake_mus', '1') === '1';

// ---------- Palette 8 bits ----------
const COL = {
  bgA: '#151933', bgB: '#191e3d', ink: '#0b0d1c',
  snA: '#3ddc84', snB: '#2bb673', snDark: '#0b3d2e', head: '#5cf29a', belly: '#b8ffd6',
  red: '#ff4d4d', redD: '#c0263a', shine: '#ffd1d1', stem: '#8b5a2b', leaf: '#3ddc84',
  pink: '#ff7ad9', white: '#f5f5ff', gold: '#ffd166', text: '#e8f0ff', tongue: '#ff3b6b'
};

// Sprites 8x8 : chaque lettre renvoie à une couleur, '.' = transparent
const SPR = {
  apple: ["....sl..", "...s.l..", ".rrrrrr.", "rwwrrrrr", "rwrrrrrr", "rrrrrrrd", ".rrrrrd.", "..rddr.."],
  pill:  ["........", "........", ".wwwppp.", "wSwwpppp", "wwwwpppp", ".wwwppp.", "........", "........"]
};
const SPRCOL = { r: COL.red, d: COL.redD, w: COL.shine, s: COL.stem, l: COL.leaf, p: COL.pink, S: '#ffffff' };
function sprite(name, x, y, pal){
  const s = SPR[name];
  for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
    const ch = s[j][i];
    if (ch === '.') continue;
    g.fillStyle = (pal && pal[ch]) || SPRCOL[ch];
    g.fillRect(x + i, y + j, 1, 1);
  }
}

// ---------- Police pixel 3x5 ----------
const FONT = {
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",
  F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",
  K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",
  P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",
  U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",
  Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110",
  "4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111",
  "9":"111101111001110","+":"000010111010000","-":"000000111000000","!":"010010010000010",":":"000010000010000",
  ".":"000000000000010"," ":"000000000000000"
};
function textW(s, sc){ return s.length * 4 * sc - sc; }
function text(s, x, y, sc, color, center, shadow){
  s = s.toUpperCase();
  if (center) x = Math.round(x - textW(s, sc) / 2);
  const draw = (ox, oy, c) => {
    g.fillStyle = c;
    for (let k = 0; k < s.length; k++) {
      const f = FONT[s[k]] || FONT[' '];
      for (let i = 0; i < 15; i++) if (f[i] === '1') g.fillRect(ox + k * 4 * sc + (i % 3) * sc, oy + ((i / 3) | 0) * sc, sc, sc);
    }
  };
  if (shadow !== false) draw(x + sc, y + sc, COL.ink);
  draw(x, y, color);
}

// ---------- Audio ----------
let ac = null;
function audio(){ if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function unlock(){ try { const a = audio(); if (a.state !== 'running') a.resume(); } catch(e){} }
function tone(f, d, type, vol, when, bend, force){
  if (!soundOn && !force) return;
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (bend && bend !== 1) o.frequency.exponentialRampToValueAtTime(f * bend, t + d);
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(vol || 0.03, t + 0.005);
  v.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(v); v.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  apple(){ tone(523, 0.06, 'square', 0.035, 0, 1.6); tone(1047, 0.07, 'square', 0.025, 0.05); },
  pill(){ tone(988, 0.25, 'triangle', 0.05, 0, 0.35); tone(1568, 0.05, 'square', 0.02, 0.05); tone(1976, 0.05, 'square', 0.02, 0.11); },
  pillSpawn(){ tone(1319, 0.05, 'square', 0.018); tone(1760, 0.06, 'square', 0.018, 0.06); },
  start(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.08, 'square', 0.03, i * 0.07)); },
  bonk(){ tone(220, 0.25, 'sawtooth', 0.05, 0, 0.4); tone(110, 0.3, 'square', 0.03, 0.05, 0.6); },
  pop(i){ tone(400 + (i % 6) * 70, 0.04, 'square', 0.014); },
  over(){ [[392,.14],[370,.14],[349,.14],[330,.45]].forEach(([f, d], i) => tone(f, d, 'square', 0.035, i * 0.16, i === 3 ? 0.5 : 1)); },
  record(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.09, 'square', 0.028, i * 0.09)); }
};

// Mini-musique chiptune (composition originale), très discrète, en boucle pendant la partie
const LEAD = [72,0,76,0,79,0,76,0, 74,0,72,0,69,0,0,0, 72,0,76,0,79,0,81,79, 76,0,74,0,72,0,0,0,
              69,0,72,0,74,0,72,0, 71,0,67,0,69,0,0,0, 72,0,74,0,76,0,79,76, 74,0,71,0,72,0,0,0];
const BASS = [48,0,55,0,48,0,55,0, 45,0,52,0,45,0,52,0, 41,0,48,0,41,0,48,0, 43,0,50,0,43,0,50,0,
              45,0,52,0,45,0,52,0, 43,0,50,0,43,0,50,0, 41,0,48,0,43,0,50,0, 48,0,55,0,48,0,0,0];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musStep = 0, musNext = 0;
setInterval(() => {
  if (!ac || ac.state !== 'running' || state !== 'play' || !musicOn) { musNext = 0; return; }
  const STEP = 0.16;
  if (!musNext || musNext < ac.currentTime) musNext = ac.currentTime + 0.05;
  while (musNext < ac.currentTime + 0.2) {
    const w = musNext - ac.currentTime;
    const l = LEAD[musStep % LEAD.length], b = BASS[musStep % BASS.length];
    if (l) tone(midi(l), 0.12, 'square', 0.009, w, 1, true);
    if (b) tone(midi(b), 0.14, 'triangle', 0.022, w, 1, true);
    musStep++; musNext += STEP;
  }
}, 40);

function renderBtns(){
  $('bSound').textContent = soundOn ? '🔊' : '🔇';
  $('bMusic').classList.toggle('off', !musicOn);
  $('bPause').textContent = state === 'pause' ? '▶' : '⏸';
}
$('bSound').addEventListener('click', () => { soundOn = !soundOn; save('snake_snd', soundOn ? '1' : '0'); unlock(); renderBtns(); });
$('bMusic').addEventListener('click', () => { musicOn = !musicOn; save('snake_mus', musicOn ? '1' : '0'); unlock(); renderBtns(); });
$('bPause').addEventListener('click', () => { unlock(); togglePause(); });

// ---------- Jeu ----------
let state = 'title';            // title | play | pause | dying | over
let snake = [], dir = {x:1, y:0}, queue = [], apple = null, pill = null;
let score = 0, eaten = 0, grow = 0, bulges = [], newRecord = false;
let tickMs = 150, acc = 0, last = 0, deathT = 0, popped = 0, shakeUntil = 0, flashUntil = 0;
let parts = [], floats = [];
let blinkAt = 0, tongueAt = 0;

function rnd(n){ return (Math.random() * n) | 0; }
function occupied(x, y){ return snake.some(s => s.x === x && s.y === y); }
function freeCell(){
  for (let k = 0; k < 400; k++) {
    const x = rnd(N), y = rnd(N);
    if (!occupied(x, y) && !(apple && apple.x === x && apple.y === y) && !(pill && pill.x === x && pill.y === y)) return { x, y };
  }
  return { x: 0, y: 0 };
}

function newGame(){
  const m = N >> 1;
  snake = [{x:m, y:m}, {x:m-1, y:m}, {x:m-2, y:m}, {x:m-3, y:m}];
  dir = {x:1, y:0}; queue = []; pill = null; apple = null;
  apple = freeCell();
  score = 0; eaten = 0; grow = 0; bulges = []; parts = []; floats = []; newRecord = false;
  tickMs = 150; acc = 0; popped = 0;
  updHud();
}

function startPlay(){
  if (state === 'title' || state === 'over') { newGame(); sfx.start(); }
  state = 'play'; last = 0;
  renderBtns();
}

function togglePause(){
  if (state === 'play') state = 'pause';
  else if (state === 'pause') { state = 'play'; last = 0; }
  renderBtns();
}

function updHud(){
  $('score').textContent = score;
  $('best').textContent = Math.max(best, score);
}

function turn(dx, dy){
  unlock();
  if (state === 'title' || state === 'over') { startPlay(); }
  if (state === 'pause') { togglePause(); }
  if (state !== 'play') return;
  const ref = queue.length ? queue[queue.length - 1] : dir;
  if ((dx === -ref.x && dy === -ref.y) || (dx === ref.x && dy === ref.y)) return;
  if (queue.length < 2) queue.push({x:dx, y:dy});
}

function burst(cx, cy, colors, n, speed){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * (speed || 1);
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.4, life: 1, c: colors[i % colors.length], sz: Math.random() < 0.3 ? 2 : 1 });
  }
}
function floatText(t, x, y, c){ floats.push({ t, x, y, life: 1, c }); }

function step(){
  if (queue.length) dir = queue.shift();
  const h = snake[0];
  const nx = (h.x + dir.x + N) % N, ny = (h.y + dir.y + N) % N;   // traversée des bords
  const eatsApple = apple && apple.x === nx && apple.y === ny;
  const keepTail = grow > 0 || eatsApple;
  const body = keepTail ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === nx && s.y === ny)) { die(); return; }

  snake.unshift({ x: nx, y: ny });
  if (grow > 0) grow--;
  else if (!eatsApple) snake.pop();
  bulges = bulges.map(b => b + 1).filter(b => b < snake.length);

  if (eatsApple) {
    score += 10; eaten++;
    sfx.apple();
    burst(nx * C + 4, ny * C + 4, [COL.red, COL.shine, COL.leaf, COL.gold], 12, 1.1);
    floatText('+10', nx * C + 4, ny * C - 2, COL.gold);
    bulges.push(0);
    apple = freeCell();
    tickMs = Math.max(68, 150 - Math.floor(eaten / 3) * 6);
    // Pilule : rare, seulement si le serpent est assez long
    if (!pill && snake.length > 7 && Math.random() < 0.14) {
      pill = Object.assign(freeCell(), { until: performance.now() + 7000 });
      sfx.pillSpawn();
    }
    if (score > best && !newRecord && best > 0) { newRecord = true; sfx.record(); floatText('RECORD!', W / 2, 20, COL.gold); }
    updHud();
  }

  if (pill && pill.x === nx && pill.y === ny) {
    const cut = Math.min(3, snake.length - 3);
    for (let i = 0; i < cut; i++) {
      const t = snake.pop();
      burst(t.x * C + 4, t.y * C + 4, [COL.pink, COL.white, COL.snA], 6, 0.8);
    }
    floatText(cut > 0 ? '-' + cut : 'OK', nx * C + 4, ny * C - 2, COL.pink);
    sfx.pill();
    flashUntil = performance.now() + 350;
    pill = null;
    bulges = bulges.filter(b => b < snake.length);
  }
}

function die(){
  state = 'dying';
  deathT = performance.now();
  popped = 0;
  shakeUntil = deathT + 380;
  sfx.bonk();
  setTimeout(() => sfx.over(), 450);
  if (score > best) { best = score; save('snake_best', best); }
  renderBtns();
}

// ---------- Dessin ----------
function drawBg(){
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    g.fillStyle = (x + y) % 2 ? COL.bgA : COL.bgB;
    g.fillRect(x * C, y * C, C, C);
  }
}

function drawSnake(now, deadPop){
  const n = snake.length;
  for (let i = n - 1; i >= 0; i--) {
    if (deadPop && i >= n - deadPop) continue;
    const s = snake[i], x = s.x * C, y = s.y * C;
    const big = bulges.includes(i);
    const flash = now < flashUntil && ((now / 60) | 0) % 2;
    if (i === 0) { drawHead(x, y, now); continue; }
    const tail = i === n - 1;
    const pad = big ? 0 : tail ? 1 : 0;
    const body = flash ? COL.white : (i % 2 ? COL.snA : COL.snB);
    g.fillStyle = COL.snDark;
    g.fillRect(x + pad, y + pad, C - pad * 2, C - pad * 2);
    g.fillStyle = body;
    g.fillRect(x + pad + 1, y + pad + 1, C - pad * 2 - 2, C - pad * 2 - 2);
    // Raccord avec le segment précédent (vers la tête) pour un corps continu
    const p = snake[i - 1], dx = p.x - s.x, dy = p.y - s.y;
    if (Math.abs(dx) + Math.abs(dy) === 1) {
      if (dx === 1) g.fillRect(x + 6, y + 2, 3, 4);
      if (dx === -1) g.fillRect(x - 1, y + 2, 3, 4);
      if (dy === 1) g.fillRect(x + 2, y + 6, 4, 3);
      if (dy === -1) g.fillRect(x + 2, y - 1, 4, 3);
    }
    if (big) { g.fillStyle = COL.belly; g.fillRect(x + 2, y + 2, 4, 4); }
    else if (!tail) { g.fillStyle = COL.belly; g.fillRect(x + 3, y + 3, 2, 2); }
  }
}

function drawHead(x, y, now){
  const dead = state === 'dying' || state === 'over';
  g.fillStyle = COL.snDark; g.fillRect(x, y, C, C);
  g.fillStyle = COL.head; g.fillRect(x + 1, y + 1, C - 2, C - 2);
  // Yeux selon la direction
  const d = dir;
  let e1, e2;
  if (d.x === 1)  { e1 = [5, 1]; e2 = [5, 5]; }
  else if (d.x === -1) { e1 = [1, 1]; e2 = [1, 5]; }
  else if (d.y === -1) { e1 = [1, 1]; e2 = [5, 1]; }
  else { e1 = [1, 5]; e2 = [5, 5]; }
  const blink = !dead && now > blinkAt && now < blinkAt + 120;
  if (now > blinkAt + 2600) blinkAt = now + 600 + Math.random() * 2400;
  [e1, e2].forEach(([ex, ey]) => {
    if (dead) {                       // yeux en croix
      g.fillStyle = COL.ink;
      g.fillRect(x + ex, y + ey, 1, 1); g.fillRect(x + ex + 1, y + ey + 1, 1, 1);
      g.fillRect(x + ex + 1, y + ey, 1, 1); g.fillRect(x + ex, y + ey + 1, 1, 1);
    } else if (blink) {
      g.fillStyle = COL.ink; g.fillRect(x + ex, y + ey + 1, 2, 1);
    } else {
      g.fillStyle = '#ffffff'; g.fillRect(x + ex, y + ey, 2, 2);
      g.fillStyle = COL.ink; g.fillRect(x + ex + (d.x > 0 ? 1 : 0), y + ey + (d.y > 0 ? 1 : 0), 1, 1);
    }
  });
  // Langue qui sort de temps en temps
  if (!dead) {
    if (now > tongueAt + 300) tongueAt = now + 900 + Math.random() * 2200;
    if (now > tongueAt) {
      g.fillStyle = COL.tongue;
      if (d.x === 1) g.fillRect(x + 8, y + 3, 2, 1);
      else if (d.x === -1) g.fillRect(x - 2, y + 4, 2, 1);
      else if (d.y === -1) g.fillRect(x + 4, y - 2, 1, 2);
      else g.fillRect(x + 3, y + 8, 1, 2);
    }
  }
}

function drawItems(now){
  if (apple) {
    const bob = ((now / 300) | 0) % 2;
    sprite('apple', apple.x * C, apple.y * C - bob);
  }
  if (pill) {
    const left = pill.until - now;
    if (left <= 0) { burst(pill.x * C + 4, pill.y * C + 4, [COL.pink, COL.white], 6, 0.6); pill = null; return; }
    if (left > 2000 || ((now / 120) | 0) % 2) {
      const glow = ((now / 200) | 0) % 2;
      sprite('pill', pill.x * C, pill.y * C, glow ? { p: '#ffa3e8' } : null);
    }
  }
}

function drawFx(){
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.03;
    g.globalAlpha = Math.max(0, p.life);
    g.fillStyle = p.c; g.fillRect(p.x | 0, p.y | 0, p.sz, p.sz);
  }
  g.globalAlpha = 1;
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) {
    f.y -= 0.25; f.life -= 0.018;
    if (f.life > 0.15 || ((f.life * 100) | 0) % 2) text(f.t, f.x, f.y | 0, 1, f.c, true);
  }
  floats = floats.filter(f => f.life > 0);
}

function panel(lines){
  g.fillStyle = 'rgba(11,13,28,0.78)';
  g.fillRect(14, 46, W - 28, 68);
  g.fillStyle = '#3a4280';
  g.fillRect(14, 46, W - 28, 2); g.fillRect(14, 112, W - 28, 2);
  lines.forEach(([t, y, sc, c]) => text(t, W / 2, y, sc, c, true));
}

function drawTitle(now){
  const bob = Math.round(Math.sin(now / 300) * 2);
  text('SNAKE', W / 2, 22 + bob, 4, COL.snA, true);
  text('DROP GAME', W / 2, 50 - bob, 2, COL.gold, true);
  sprite('apple', 38, 78); text('POMME +10', 50, 80, 1, COL.text);
  sprite('pill', 38, 92);  text('PILULE -3', 50, 94, 1, COL.text);
  text('LES BORDS SE TRAVERSENT', W / 2, 112, 1, '#9aa4d6', true);
  if (((now / 450) | 0) % 2) text('TOUCHE UNE FLECHE', W / 2, 132, 1, COL.head, true);
  if (best) text('RECORD ' + best, W / 2, 146, 1, COL.gold, true);
}

let lastFrame = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = lastFrame ? Math.min(100, now - lastFrame) : 16;
  lastFrame = now;

  if (state === 'play' && !document.hidden) {
    acc += dt;
    while (acc >= tickMs && state === 'play') { acc -= tickMs; step(); }
  }

  g.save();
  if (now < shakeUntil) g.translate(rnd(3) - 1, rnd(3) - 1);
  drawBg();

  if (state === 'title') { drawTitle(now); drawFx(); g.restore(); return; }

  drawItems(now);

  if (state === 'dying') {
    // Le serpent éclate segment par segment, de la queue vers la tête
    const t = now - deathT;
    const want = Math.max(0, Math.floor((t - 500) / 45));
    while (popped < Math.min(want, snake.length - 1)) {
      const s = snake[snake.length - 1 - popped];
      burst(s.x * C + 4, s.y * C + 4, [COL.snA, COL.head, COL.belly, COL.gold], 5, 0.9);
      sfx.pop(popped);
      popped++;
    }
    drawSnake(now, popped);
    if (popped >= snake.length - 1 && t > 500 + snake.length * 45 + 500) { state = 'over'; renderBtns(); }
  } else {
    drawSnake(now, state === 'over' ? snake.length - 1 : 0);
  }

  drawFx();

  if (state === 'pause') panel([['PAUSE', 62, 3, COL.gold], ['TOUCHE UNE FLECHE', 96, 1, COL.text]]);
  if (state === 'over') {
    panel([['GAME OVER', 54, 2, COL.red], ['SCORE ' + score, 74, 1, COL.gold],
           [newRecord ? 'NOUVEAU RECORD!' : 'RECORD ' + best, 86, 1, newRecord ? COL.head : COL.text],
           [((now / 450) | 0) % 2 ? 'TOUCHE POUR REJOUER' : '', 100, 1, COL.text]]);
  }
  g.restore();
}

// ---------- Commandes ----------
function bind(id, dx, dy){ $(id).addEventListener('pointerdown', e => { e.preventDefault(); turn(dx, dy); }); }
bind('up', 0, -1); bind('down', 0, 1); bind('left', -1, 0); bind('right', 1, 0);
document.addEventListener('keydown', e => {
  const k = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] }[e.key];
  if (k) { e.preventDefault(); turn(k[0], k[1]); }
  else if (e.key === ' ' || e.key === 'p') { e.preventDefault(); unlock(); if (state === 'title' || state === 'over') startPlay(); else togglePause(); }
});

// Glisser le doigt sur le terrain pour tourner ; toucher pour commencer / rejouer
let sx = 0, sy = 0, swiped = false;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiped = false; unlock(); });
cv.addEventListener('pointermove', e => {
  if (swiped || !e.buttons && e.pointerType === 'mouse') return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  swiped = true;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
});
cv.addEventListener('pointerup', () => {
  if (swiped) return;
  if (state === 'title' || state === 'over') { if (state !== 'over' || performance.now() - deathT > 1200) startPlay(); }
  else if (state === 'pause') togglePause();
});

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'pause'; renderBtns(); } });

updHud();
renderBtns();
requestAnimationFrame(frame);
</script>
